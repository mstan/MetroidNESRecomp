format_version = 1
id = "metroid.enhancement.widescreen"
version = "1.0.0"
name = "Metroid Widescreen"
author = "NESRecomp"
description = "Renders Metroid at a widescreen aspect by re-compositing the world from the live nametables, a per-screen room cache, and a native port of the game's own room decoder. The stock ROM is not modified."
license = "MIT"
resolver = "declarative"
save_compatibility = "stock"

# Metroid (USA) -- the ROM this build is recompiled from and the only one the
# CRC32 gate in extras.c accepts today.
[[target]]
game_id = "metroid-nes"
rom_crc32 = "70080810"

# EU requires a separately generated and validated build, including the game
# hooks and the transfer caller check. Do not advertise compatibility yet.

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Shows adjacent rooms in the side margins, keeps loaded-room enemies visible beyond the original screen edge, and anchors the status bar. Optional enhancements add viewport enemies, expanded sprites and reduced slowdown."
group = "Display"
exclusive_group = "display-mode"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect"
description = "Output aspect ratio with square pixels. Fit follows the window, clamped between 16:15 and 32:9."
type = "choice"
default = "fit"

[[option.choice]]
value = "fit"
label = "Fit window (adaptive)"

[[option.choice]]
value = "16-9"
label = "16:9"

[[option.choice]]
value = "21-9"
label = "21:9"

[[option.choice]]
value = "32-9"
label = "32:9"

[[option]]
feature = "widescreen"
id = "hud"
label = "Status bar"
description = "Where the energy and missile display sits in the widened picture."
type = "choice"
default = "edges"

[[option.choice]]
value = "edges"
label = "Pinned to the screen edge"

[[option.choice]]
value = "center"
label = "Centered (stock position)"

[[plugin]]
feature = "widescreen"
id = "metroid.widescreen"

[[option]]
feature = "widescreen"
id = "actors"
label = "Enemy and item range"
description = "Viewport mode pre-spawns ordinary enemies and previews uncollected items in visible rooms. Enemies retain their original attack distances. Original uses the game's loaded-room spawn limits."
type = "choice"
default = "stock"

[[option.choice]]
value = "stock"
label = "Original"

[[option.choice]]
value = "viewport"
label = "Viewport (experimental)"

[[option]]
feature = "widescreen"
id = "sprites"
label = "Sprite capacity"
description = "Expanded captures object sprites before the NES sprite buffer wraps, reducing missing or flickering objects. It also shows both room-door faces with synchronized animations."
type = "choice"
default = "stock"

[[option.choice]]
value = "stock"
label = "Original"

[[option.choice]]
value = "expanded"
label = "Expanded (experimental)"

[[option]]
feature = "widescreen"
id = "timing"
label = "Gameplay slowdown"
description = "Reduced slowdown removes the emulated CPU budget from world updates while retaining the game's movement routines. This can change timing; Original keeps the original world-update budget."
type = "choice"
default = "stock"

[[option.choice]]
value = "stock"
label = "Original"

[[option.choice]]
value = "smooth"
label = "Reduced slowdown (experimental)"
